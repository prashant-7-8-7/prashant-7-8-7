<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="110" viewBox="0 0 1120 110" role="img" aria-labelledby="title desc">
<title id="title">Contribution animation</title><desc id="desc">Awaiting the first successful GitHub Actions run. No sample statistics are displayed.</desc>
<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087e94"/><stop offset="1" stop-color="#6d49ca"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#6d49ca" stop-opacity=".18"/><stop offset="1" stop-color="#6d49ca" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#4b607f" opacity=".16"/></pattern></defs>
<style>text{font-family:Inter,'Segoe UI',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,monospace}.signal{stroke-dasharray:7 28;animation:flow 12s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 6s ease-in-out infinite}.orbit{transform-origin:925px 190px;animation:orbit 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-210}}@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.signal,.pulse,.orbit{animation:none!important}}</style>
<rect x=".5" y=".5" width="1119" height="109" rx="20" fill="#f5f7ff" stroke="#cbd5ed"/>
<text x="32" y="61" fill="#4b607f" font-size="18">Contribution animation appears after the first successful refresh.</text></svg>
