name: Refresh profile visuals

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [contribution-push]
  push:

permissions:
  contents: read

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    name: Generate visuals with read-only access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Render actual contribution summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_activity.py

      - name: Generate Yoshi's animated 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # verified latest branch, Node 24
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: scripts/3d-settings.json

      - name: Prepare and validate generated SVGs
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          import xml.etree.ElementTree as ET
          for theme in ('dark', 'light'):
              shutil.copyfile(
                  Path('profile-3d-contrib') / f'contributions-3d-{theme}.svg',
                  Path('assets') / f'contributions-3d-{theme}.svg',
              )
          names = ['activity-dark.svg', 'activity-light.svg', 'contributions-3d-dark.svg', 'contributions-3d-light.svg']
          for name in names:
              path = Path('assets') / name
              root = ET.parse(path).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', name
              assert not root.findall('.//{http://www.w3.org/2000/svg}script'), name
              if name.startswith('contributions-3d'):
                  assert len(root.findall('.//{http://www.w3.org/2000/svg}rect')) > 365, name
          print('All four generated SVGs are valid; 3D calendars contain real calendar geometry.')
          PYCODE

      - name: Transfer generated visuals
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-visuals
          path: |
            assets/activity-*.svg
            assets/contributions-3d-*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish generated images
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out latest profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download generated visuals
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profile-visuals
          path: assets

      - name: Publish content-versioned image filenames
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import re
          import shutil
          readme = Path('README.md')
          content = readme.read_text(encoding='utf-8')
          generated = Path('assets/generated')
          generated.mkdir(parents=True, exist_ok=True)
          names = ['activity-dark.svg', 'activity-light.svg', 'contributions-3d-dark.svg', 'contributions-3d-light.svg']
          for name in names:
              source = Path('assets') / name
              digest = hashlib.sha256(source.read_bytes()).hexdigest()[:16]
              versioned = generated / f'{source.stem}-{digest}.svg'
              shutil.copyfile(source, versioned)
              pattern = rf'assets/(?:generated/)?{re.escape(source.stem)}(?:-[0-9a-f]{{16}})?\.svg(?:\?v=[0-9a-f]+)?(?=")'
              content, count = re.subn(pattern, lambda match: versioned.as_posix(), content)
              if not count:
                  raise ValueError(f'No README image reference found for {name}')
              for old in generated.glob(f'{source.stem}-*.svg'):
                  if old != versioned and re.fullmatch(rf'{re.escape(source.stem)}-[0-9a-f]{{16}}\.svg', old.name):
                      old.unlink()
          readme.write_text(content, encoding='utf-8')
          print('Updated all generated image filenames to match their content.')
          PY

      - name: Commit only changed images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md assets/activity-dark.svg assets/activity-light.svg assets/contributions-3d-dark.svg assets/contributions-3d-light.svg assets/generated
          git rm --ignore-unmatch assets/snake-dark.svg assets/snake-light.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh profile 3D contribution visuals [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Could not publish after concurrent changes; previous graphics remain available.' >&2
          exit 1
