name: Refresh profile visuals

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-assets.yml'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    name: Generate visuals with read-only access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render actual contribution summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_activity.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=#b5a1ff&color_dots=#151f32,#164356,#17687c,#249db0,#67e8f9
            assets/snake-light.svg?palette=github-light&color_snake=#6d49ca&color_dots=#edf0fa,#c2e4ec,#83c8d8,#339db6,#087e94

      - name: Validate generated SVGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          names = ['activity-dark.svg', 'activity-light.svg', 'snake-dark.svg', 'snake-light.svg']
          for name in names:
              path = Path('assets') / name
              root = ET.parse(path).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', name
              assert not root.findall('.//{http://www.w3.org/2000/svg}script'), name
          print('All four generated SVGs are valid.')
          PY

      - name: Transfer generated visuals
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-visuals
          path: |
            assets/activity-*.svg
            assets/snake-*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish generated images
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out latest profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download generated visuals
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profile-visuals
          path: assets

      - name: Commit only changed images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/activity-dark.svg assets/activity-light.svg assets/snake-dark.svg assets/snake-light.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh profile contribution visuals [skip ci]'
          git push origin HEAD:main
